# General set up
set -g prefix 'C-Space'
bind 'C-Space' send-prefix
unbind C-b

set -s escape-time 1
set -g base-index 1
setw -g pane-base-index 1

setw -g monitor-activity on
set -g visual-activity on

bind-key ';' switch-client -l
bind-key s switch-client -t proj

bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Sessions
bind a switch-client -l
bind-key s run-shell "sesh connect \"$(
  sesh list | fzf-tmux -p 80%,70% \
    --no-sort \
    --border-label ' sesh ' \
    --prompt '⚡  '
)\""

# Windows
bind b last-window
bind C confirm-before -p "kill-window #W? (y/n)" kill-window
unbind &

# Panes
# bind V split-window -h
# bind v split-window -v
bind v run-shell "dir=\"\$(tmux display-message -p '#{pane_current_path}')\"; tmux split-window -h -c \"\$dir\"; tmux send-keys -t ! 'z \$dir' C-m"
bind V run-shell "dir=\"\$(tmux display-message -p '#{pane_current_path}')\"; tmux split-window -v -c \"\$dir\"; tmux send-keys -t ! 'z \$dir' C-m"

bind H resize-pane -L 5
bind J resize-pane -U 5
bind K resize-pane -D 5
bind L resize-pane -R 5

unbind '"'
unbind %
unbind M-Up
unbind M-Down
unbind M-Left
unbind M-Right
# unbind C-f

# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# bind -n C-h if -F '#{m:#{pane_current_command},(n?vim|vimdiff)}' 'send-keys C-h' 'select-pane -L'
# bind -n C-j if -F '#{m:#{pane_current_command},(n?vim|vimdiff)}' 'send-keys C-j' 'select-pane -D'
# bind -n C-k if -F '#{m:#{pane_current_command},(n?vim|vimdiff)}' 'send-keys C-k' 'select-pane -U'
# bind -n C-l if -F '#{m:#{pane_current_command},(n?vim|vimdiff)}' 'send-keys C-l' 'select-pane -R'


# Colors / Colours
# set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g status-bg colour235
# set -g status-style default
set -g status-fg colour231
set -g status-interval 2
set -g status-justify left

# set -g window-status-format "#[bg=colour235,fg=colour61,noreverse] #I #W#F"
set -g window-status-format "#[bg=colour235,fg=colour61,noreverse,nounderscore] #I #W#F "
set -g window-status-current-format "#[bg=colour235,fg=colour61]#[bg=colour61,fg=colour235] #W [#F] #[bg=colour235,fg=colour61]"

setw -g mode-style 'bg=colour61,fg=colour235'        # Style for copy-mode/highlight region (matches your palette)

# set -g status-left "#[bg=colour141,fg=colour234] #S #[bg=colour61,fg=colour141]#[bg=colour61,fg=colour235] #P #[bg=default,fg=colour61] "
set -g status-left "#[bg=#{?client_prefix,colour99,colour141},fg=colour234] #S #[bg=colour61,fg=#{?client_prefix,colour99,colour141}]#[bg=colour61,fg=colour235] #P #[bg=default,fg=colour61] "
set -g status-left-length 50

# set -g status-right "#[bg=colour61,fg=colour234]#(~/.bin/tmux-spotify-info)#[bg=colour141,fg=colour234] %d %b %R "
# set -g status-right "#[bg=default,fg=colour61]#[bg=colour61,fg=colour235] #{s|$HOME|~|;s|/.*/|/…/|:pane_current_path} #[bg=colour61,fg=colour141]#[bg=colour141,fg=colour235] %d %b %R "
set -g status-right "#[bg=default,fg=colour61]#[bg=colour61,fg=colour235] #{?pane_in_mode,[COPY],#{?client_prefix,[CMD],}} #{s|$HOME|~|;s|/.*/|/…/|:pane_current_path} #[bg=colour61,fg=colour141]#[bg=colour141,fg=colour235] %d %b %R "
# set -g status-right-length 90

set -g @plugin 'tmux-plugins/tpm'

# bind-key "f" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"
# set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'
