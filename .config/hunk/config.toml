# ~/.config/hunk/config.toml

# Matches the Dracula direction you've been moving toward.
theme = "dracula"

# Side-by-side when there's room, stacked when there isn't.
# Good fit since you're bouncing between full-width Herdr tabs
# and narrower terminal situations.
mode = "auto"

# You're firmly Git-based currently.
vcs = "git"

# Don't globally watch. Explicitly use `hunk diff --watch`
# when an agent/process is actively changing files.
watch = false

# New files absolutely matter during review.
exclude_untracked = false

# Programmer-friendly defaults.
line_numbers = true
tab_width = 2
wrap_lines = false

# Keep navigation available for multi-file agent changes.
sidebar = "auto"

# Keep the UI discoverable without making it too minimal.
menu_bar = true

# You use agents heavily, but notes shouldn't pollute every normal diff.
agent_notes = false

# You're using terminal transparency already.
transparent_background = true

# Don't nag when I temporarily toggle layout/wrapping/etc.
prompt_save_view_preferences = false
