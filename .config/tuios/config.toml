# TUIOS Configuration File
# This file allows you to customize appearance and keybindings
#
# Configuration location: $XDG_CONFIG_HOME/tuios/config.toml
# Documentation: https://github.com/Gaurav-Gosain/tuios
# For keybindings documentation, run: tuios keybinds list
#
# tuios watches this file. A save takes effect at once, with no restart.
# tuios does not apply a file that has an error. It keeps the settings that
# are in use and shows the error on screen.

# ============================================================================
# APPEARANCE SETTINGS
# ============================================================================
# Many of these can be changed live from the in-app settings page
# (open it with the leader key followed by ',').
#
# border_style: rounded, normal, thick, double, hidden, block, ascii,
#               outer-half-block, inner-half-block
# dockbar_position: bottom, top, hidden
# window_title_position: bottom, top, hidden
# window_button_style: pill, dots (macOS traffic lights)
# window_button_position: right, left. Independent of the style; dots and
#               left is the shipped pair, the macOS arrangement
# theme: color theme name (e.g. dracula, nord); empty for terminal colors
# click_to_type: single (a click on a pane starts typing in it), double
#               (two clicks do), off (a click only focuses)
# auto_enter_terminal_on_focus: off (Tab keeps cycling windows),
#               targeted (numbered select and arrows start typing),
#               all (every covered focus command, including Tab)
# [appearance.scrollbar]: style = thin, track; thumb/track = a one-cell glyph
#               (track also takes "none"); tint = border, muted, #RRGGBB
# background: off (your terminal shows through), theme (the theme's
#               background), or #RRGGBB, for every surface at once
# pane_background, desktop_background, window_chrome_background,
#               dock_background, [appearance.sidebar] background: the same
#               values for one surface; empty follows background, and a
#               colour a program or the chrome chose always wins
# ============================================================================

# ============================================================================
# KEYBINDINGS
# ============================================================================
# Set an action to [] to unbind it and hand the key back to the shell.
# An empty list and a missing line are not the same thing. A line this file
# does not have gets its default back the next time tuios starts; an action
# set to [] stays empty.
#
# You do not have to edit this by hand. In tuios, open the keybind manager
# (leader then k, or the command palette) and press ctrl+d on a binding to
# remove it, or ctrl+x to take its key off every action. From a shell:
#
#   tuios keybinds unbind close_window w   # one key off one action
#   tuios keybinds free alt+left           # off every action
#
# `tuios keybinds doctor` says which binding in each scope is live, what
# clashes with what, and which keys never reach the program in the pane.
#
# [keybindings.global] acts in window mode and terminal mode alike. It binds
# ctrl+p to the command palette and alt+space to the launcher, which costs
# you fish's history-back and readline's set-mark. To move or drop either:
#
#   [keybindings.global]
#   command_palette = ["ctrl+shift+p"]
#   launcher = []
#
# [keybindings.terminal_mode] binds alt+arrows to move focus between panes.
# In readline, fish and zsh, alt+left and alt+right move the cursor a word
# at a time. If you want those back:
#
#   [keybindings.terminal_mode]
#   terminal_focus_left = []
#   terminal_focus_right = []
#
# alt+up and alt+down are unclaimed by the common shells, so they are the
# safer pair to keep.
#
# shift+pgup and shift+pgdown scroll one page. middle pastes from the host
# clipboard. Write ctrl+middle to add a modifier.
#
# hold_window_mode binds a key that puts tuios in window-management mode for
# as long as it is physically held, and hands the previous mode back when it
# is let go:
#
#   [keybindings.mode_control]
#   hold_window_mode = ["leftalt"]
#
# It needs a terminal that speaks the Kitty keyboard protocol (Ghostty, kitty,
# WezTerm, foot, Alacritty; not Terminal.app), because nothing else reports
# that a key was released. Naming a modifier key (leftalt, rightalt, leftctrl,
# leftsuper) asks the terminal for one more thing on top: every keystroke in
# the session then arrives as an escape code. Any ordinary key (f13 to f63,
# scrolllock, a spare letter) avoids that. Unbound by default.
# ============================================================================

# ============================================================================
# DOCK COMPONENTS
# ============================================================================
# The dock is three ordered lists of component names. Leave [dock] out
# entirely and the bar draws what it always drew; write the lists to
# reorder it, and omit a name to drop that segment.
#
#   [dock]
#   left   = ["mode", "workspaces", "trail", "tape"]
#   center = ["windows"]
#   right  = ["notifications", "copy-help", "cpu", "ram", "clock", "session-controls"]
#
# A cell of your own is a command whose first line of stdout is the text:
#
#   [dock.custom.branch]
#   command = "git branch --show-current"
#   refresh = "event:after-focus-change"   # or once, push, or "30s"
#
# and then "custom/branch" in one of the lists above. A component that
# fails is hidden rather than left showing a stale value;
# `tuios list-dock-components` says which and why.
# ============================================================================

[startup]
tiled = true
daemon = true
layout = "scrolling"

# Do not retain potentially sensitive terminal output on disk.
[daemon]
persist_scrollback = false

# Agents should not control other sessions or daemon administration by default.
[agents.permissions]
mode = "strict"

# =============================================================================
# TUIOS
#
# Migrated from Herdr + tmux
#
# Philosophy:
#   - Sessions represent projects.
#   - Workspaces represent Herdr tabs.
#   - Windows represent Herdr panes.
#   - Prefer workspace navigation over window navigation.
#   - Preserve familiar keybindings wherever possible.
#   - Keep Surecast and wt responsibilities separate.
# =============================================================================

# =============================================================================
# Appearance
# =============================================================================

[appearance]
theme = "dracula"

# Herdr's bottom tab bar.
dockbar_position = "bottom"
dock_workspace_tabs = true
dock_workspace_tab_format = "{index}: {name}{zoom}"
dock_compact = true

# Keep the dock relatively quiet.
show_clock = true
clock_format = "15:04"
show_cpu = false
show_ram = false

# New windows inherit the current working directory.
new_window_inherit_cwd = true

# Use the current shell.
preferred_shell = ""

# Keep pane navigation separate from Neovim navigation.
nvim_navigation = false

# Prefer tiling for Neovim + agent layouts.
tiling_scheme = "longest_side"

# Zoom should behave like tmux.
zoom_size = 100
zoom_animation = false

scrollback_lines = 50000

# Keep close actions deliberate.
confirm_quit = true

# =============================================================================
# Dock
# =============================================================================

[appearance.sidebar]
enabled = true
position = "right"
width = 28

# No file explorer.
# No fixed percentage allocations.
sections = "sessions,terminals,agents"

header_case = "uppercase"

show_glyphs = true
show_counts = true

# =============================================================================
# Notifications
# =============================================================================

[dock.tabs]
style = "flat"
separator = " · "
active_bold = true

# =============================================================================
# Sidebar / Session Rail
# =============================================================================

[notifications.agent]
enabled = true
notify = true
dock = true

# Similar to Herdr's sound notifications.
sound = true

# Don't notify for the agent we're actively watching.
suppress_focused = true

# =============================================================================
# Keybindings
# =============================================================================

[keybindings]
leader_key = "ctrl+space"

# Terminal mode sends keys to the running application.
# The prefix temporarily unlocks TUIOS commands.
lock = true

# =============================================================================
# Prefix Mode
# =============================================================================

[keybindings.prefix_mode]
# ---------------------------------------------------------------------------
# Sessions / Projects
# ---------------------------------------------------------------------------

# Herdr: prefix+s -> goto
# tmux:  prefix+s -> sesh
prefix_session_switcher = ["s"]

# Herdr: prefix+w -> workspace picker
# TUIOS: workspace switcher
prefix_workspace_switcher = ["W"]

# Preserve TUIOS's native workspace submenu on prefix+w.
prefix_workspace = ["w"]

# ---------------------------------------------------------------------------
# Sidebar
# ---------------------------------------------------------------------------

# Herdr-style show/hide sidebar.
prefix_toggle_sidebar = ["b"]

# Keep Spotlight available, but not on lowercase b.
prefix_toggle_spotlight = ["B"]

# ---------------------------------------------------------------------------
# Windows / Panes
# ---------------------------------------------------------------------------

# Herdr: v = side-by-side, V = stacked.
prefix_split_vertical = ["v"]
prefix_split_horizontal = ["V"]

# These navigate windows, not workspaces.
# Keep them available temporarily while evaluating TUIOS.
prefix_next_window = ["n"]
prefix_prev_window = ["p"]

# Individual window lifecycle.
prefix_close_window = ["x"]

# Zoom.
prefix_fullscreen = ["z"]

# ---------------------------------------------------------------------------
# Copy / Detach / Help
# ---------------------------------------------------------------------------

prefix_selection = ["["]
prefix_detach = ["d"]
prefix_help = ["?"]

# ---------------------------------------------------------------------------
# Scratch Terminal
# ---------------------------------------------------------------------------

# Herdr used prefix+t.
# TUIOS uses prefix+t for its window submenu.
# Keep the native scratch binding for now.
toggle_scratch = ["t"]

# ---------------------------------------------------------------------------
# Disable Native Worktree Creation
# ---------------------------------------------------------------------------

# wt owns worktree lifecycle, not TUIOS.
new_worktree = []

# =============================================================================
# Remove conflicting TUIOS defaults
# =============================================================================

# s: Session switcher, not scrollback.
prefix_scrollback = []

# v: Split vertically, not review.
prefix_review = []

# V: Split horizontally, not paste image.
paste_image = []

# r: Reserved for config reload, not rename.
prefix_rename_window = []

# C: Reserved for close-tab behavior, not screenshot.
prefix_screenshot = []

# a: Reserved for previous session/client.
launcher = []

# t: Scratch terminal, not the window submenu.
prefix_window = []

[keybindings.global]
# Don't steal Ctrl+P from Neovim.
command_palette = []

# =============================================================================
# Scratch
# =============================================================================

[scratch]
width = "85%"
height = "85%"

# =============================================================================
# Workspaces
# =============================================================================

# ---------------------------------------------------------------------------
# Avoid Unwanted Key Interception
# ---------------------------------------------------------------------------

[workspaces]
# Switching to an empty workspace creates a terminal.
new_window_when_empty = true

# =============================================================================
# Startup / Daemon
# =============================================================================

# Intentionally using TUIOS defaults.
#
# We want detach/reattach.
# We're not implementing automatic cleanup or systemd services yet.
#
# Revisit restoration behavior after some real-world use.

# =============================================================================
# Remote Hosts
# =============================================================================

# Wayfinder will eventually be the primary development host.
#
# No remote configuration until WSL2 + Tailscale + SSH are ready.

# =============================================================================
# Future: Long-Running Processes
# =============================================================================

# Eventually add a custom rail section for:
#
#   pnpm dev
#   hunk --watch
#   tsc --watch
#   test watchers
#   background workers
#
# Don't add an empty custom section yet.

# =============================================================================
# Intentionally Unresolved
# =============================================================================

# Herdr:
#   prefix+1..9 -> switch tab
#   prefix+n/p  -> next/previous tab
#
# TUIOS:
#   prefix+1..9 -> focus window
#   prefix+n/p  -> next/previous window
#
# These are NOT equivalent.
#
# Native workspace navigation remains:
#   Alt+1..9
#   Prefix+w, then 1..9
#
# We need to determine whether a native remapping can preserve
# Herdr's direct prefix-to-workspace navigation.
